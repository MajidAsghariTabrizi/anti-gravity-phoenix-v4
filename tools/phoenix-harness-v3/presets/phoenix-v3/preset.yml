name: Phoenix V3 Production
description: Phoenix Intelligence Operating System V3 — the production preset (installed build of tools/phoenix-harness-v3). Mission compiler, layered context (30-70K targets), round/budget governor with mission-start delta budgets, tiered transport retries (routine 2 / normal 3 / critical 6) with a TRANSPORT class override (normal 8, bounded 500ms..30s schedule), compaction circuit breaker with prune-only fallback and adaptive summary sizing, and 15 fail-closed native Phoenix tools. The frozen V2 build remains available as phoenix-v2-rollback.

  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction (V3 context-compiler policy) ────────────────────────────────
#
# Targets: normal working surface 30-70K; multi-domain P95 <= 96K; hard
# limit <= 160K. thresholdRatio 0.09 on the routed 1M window triggers
# compaction before the pressure band tops out (calibrated: peak surface
# ~92K with 2.1K/step growth — P95 target met with margin); retainTokens
# 32768 keeps the recent tail absolute (32K); maxTokens 6144 caps the
# compaction summary at <= 6K tokens (target 4-6K); summarization runs on
# the cheap V4 Flash route so compaction never consumes expensive
# reasoning tokens.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.09
        retainTokens: 32768
        summarizationProvider: deepseek-official
        summarizationModel: deepseek-v4-flash
        maxTokens: 6144
        compactionRetries: 1

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── Phoenix Harness V3 extensions ───────────────────────────────────────────
#
# Preset-local plugin (zero external dependencies; node builtins only):
# mission compiler, layered context, governor, telemetry with argument
# fingerprints, and the 15 typed fail-closed native tools.
# Installed build of tools/phoenix-harness-v3/src/ (see .installed.json).
#
# Quickfix config (V3 production update):
#   - compactionGuard: circuit breaker (2 failures open; prune-only fallback)
#     + adaptive summary size (6K floor / 16K cap) around compaction streams.
#   - transportRetries: tiered request-level retries routine=2 / normal=3 /
#     critical=6, with a TRANSPORT class override normal=8 (bounded schedule
#     500ms..30s; tier from the reasoning-tier classifier; the flat provider
#     retry policy stays disabled in the host profile patch).
#   - workspaceRoot resolves through the canonical repo-root resolver
#     (PHOENIX_REPO_ROOT > configured root > .git/.phoenix-harness markers).

- id: phoenix-harness-v3
  name: ./plugins/dsh-phoenix-harness-v3/lib/plugin.js
  config:
    workspaceRoot: !!js process.cwd()
    knowledgeRoot: !!js "process.getBuiltinModule('node:path').join(process.cwd(), 'tools', 'phoenix-harness-v3', 'knowledge')"
    compactionGuard:
      tripThreshold: 2
      cooldownMs: 300000
      maxCooldownMs: 1800000
      maxTokensFloor: 6144
      maxTokensCap: 16384
      charsPerToken: 3.2
    transportRetries:
      routine: 2
      normal: 3
      critical: 6

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000


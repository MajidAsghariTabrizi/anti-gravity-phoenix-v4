name: Deprecated Autonomous LIVE Deployment

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Type USE_PHOENIX_RELEASE_CONTROLLER
        required: true
        type: string

permissions:
  contents: read

jobs:
  deprecated:
    name: use-phoenix-release-controller
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject legacy manual deployment
        shell: bash
        env:
          ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
        run: |
          set -euo pipefail
          [ "$ACKNOWLEDGEMENT" = USE_PHOENIX_RELEASE_CONTROLLER ] || true
          echo "This SCP/manual deployment path is deprecated and disabled."
          echo "Use Phoenix Release Controller workflow_dispatch for exact-SHA resume."
          exit 1

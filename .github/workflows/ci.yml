        if: ${{ needs.hygiene.outputs.job_docker_validation == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Docker Buildx
        if: ${{ needs.hygiene.outputs.job_docker_validation == 'true' && needs.hygiene.outputs.built_images != '[]' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Validate affected Dockerfiles without building
        if: ${{ needs.hygiene.outputs.job_docker_validation == 'true' && github.event_name == 'pull_request' && needs.hygiene.outputs.built_images != '[]' }}
        shell: bash
        env:
          BUILT_IMAGES: ${{ needs.hygiene.outputs.built_images }}
        run: |
          set -euo pipefail
          while IFS= read -r component; do
            context="$(jq -r .context <<<"$component")"
            dockerfile="$(jq -r .dockerfile <<<"$component")"
            command=(docker buildx build --check -f "$dockerfile")
            while IFS= read -r build_arg; do
              command+=(--build-arg "$build_arg")
            done < <(
              jq -r \
                '.build_args | select(length > 0) | split("\n")[]' \
                <<<"$component"
            )
            "${command[@]}" "$context"

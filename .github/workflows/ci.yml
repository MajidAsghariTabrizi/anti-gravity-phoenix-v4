name: Phoenix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  PHOENIX_RELEASE_IMAGE_SET: current

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      classification: ${{ steps.impact.outputs.classification }}
      release_required: ${{ steps.impact.outputs.release_required }}
      docker_static: ${{ steps.impact.outputs.docker_static }}
      built_images: ${{ steps.impact.outputs.built_images }}
      inherited_images: ${{ steps.impact.outputs.inherited_images }}
      job_go: ${{ steps.impact.outputs.job_go }}
      job_rust_phoenix: ${{ steps.impact.outputs.job_rust_phoenix }}
      job_rust_rpc_gateway: ${{ steps.impact.outputs.job_rust_rpc_gateway }}
      job_rust_recorder: ${{ steps.impact.outputs.job_rust_recorder }}
      job_rust_replay: ${{ steps.impact.outputs.job_rust_replay }}
      job_rust_fork_sandbox: ${{ steps.impact.outputs.job_rust_fork_sandbox }}
      job_solidity: ${{ steps.impact.outputs.job_solidity }}
      job_python_dashboard: ${{ steps.impact.outputs.job_python_dashboard }}
      job_docker_validation: ${{ steps.impact.outputs.job_docker_validation }}
      job_integration_fixtures: ${{ steps.impact.outputs.job_integration_fixtures }}
      job_jetstream_integration: ${{ steps.impact.outputs.job_jetstream_integration }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Classify changed paths once
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              ;;
            workflow_dispatch)
              base_sha="$(git rev-parse HEAD^)"
              ;;
            *)
              echo "unsupported Phoenix CI trigger: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          python3 scripts/change_impact.py github-output \
            --base "$base_sha" \
            --head "$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          python3 scripts/change_impact.py git \
            --base "$base_sha" \
            --head "$GITHUB_SHA" \
            --output change-impact.json
          cat change-impact.json >>"$GITHUB_STEP_SUMMARY"

      - name: Setup Go for workflow lint
        if: ${{ steps.impact.outputs.job_hygiene == 'true' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: feed-ingestor/go.mod
          cache: false

      - name: Install release schema validator
        if: ${{ steps.impact.outputs.job_hygiene == 'true' }}
        shell: bash
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Run secret scans
        if: ${{ steps.impact.outputs.job_hygiene == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/secret-scan.ps1
          sh ./scripts/secret-scan.sh

      - name: Run forbidden file checks
        if: ${{ steps.impact.outputs.job_hygiene == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/forbidden-file-check.ps1
          sh ./scripts/forbidden-file-check.sh

      - name: Validate shell syntax
        if: ${{ steps.impact.outputs.job_hygiene == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/*.sh
          shellcheck --severity=warning \
            scripts/activate-economic-canary.sh \
            scripts/economic-dashboard-loop.sh \
            scripts/deploy-release.sh \
            scripts/finalize-phoenix-deploy-bootstrap.sh \
            scripts/install-autonomous-live-deploy-gateway.sh \
            scripts/install-phoenix-release-platform.sh \
            scripts/install-production-release-context.sh \
            scripts/autonomous-live-release-contract-tests.sh \
            scripts/live-executor-isolated-fork-tests.sh \
            scripts/phoenix-autonomous-live-deploy-gateway.sh \
            scripts/phoenix-release-gateway.sh \
            scripts/phoenix-release-platform-tests.sh \
            scripts/phoenix-release-transport.sh \
            scripts/production-healthcheck.sh \
            scripts/required-service-absence.sh \
            scripts/required-service-absence-tests.sh \
            scripts/rotate-phoenix-executor-live.sh \
            scripts/rotate-phoenix-executor-live-tests.sh \
            scripts/render-production-compose.sh \
            scripts/verify-image-runtime.sh \
            scripts/rollback-release.sh \
            scripts/validate-production-env.sh \
            scripts/validate-production-release-context.sh
          SHELLCHECK_OPTS=--severity=warning \
            go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Setup Node for Phoenix Harness V3 tests
        if: ${{ steps.impact.outputs.job_hygiene == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run Phoenix Harness V3 node tests
        if: ${{ steps.impact.outputs.job_hygiene == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd tools/phoenix-harness-v3
          node --test tests/*.test.mjs

      - name: Run focused pull-request release validation
        if: ${{ steps.impact.outputs.job_hygiene == 'true' && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/change_impact.py \
            scripts/release_assets.py \
            scripts/release_components.py \
            scripts/release_platform.py \
            scripts/release_provenance.py \
            scripts/phoenix_executor_rotation_context.py \
            scripts/production_mode.py \
            scripts/atlas_aave_fork_package.py \
            scripts/atlas_aave_candidate_exact_validator.py \
            scripts/atlas_aave_economic_prefilter.py \
            scripts/atlas_aave_provider_preflight.py \
            scripts/atlas_aave_provider_agreement.py \
            scripts/atlas_shadow_validation_report.py \
            scripts/atlas_liquidation_ground_truth.py \
            scripts/atlas_borrower_index.py \
            scripts/ethereum_state_proof.py \
            scripts/export_aave_borrow_discovery.py \
            scripts/export_aave_checkpoint.py \
            scripts/probe_aave_archive_provider.py \
            scripts/verify_aave_borrow_archive.py \
            scripts/phoenix_release/*.py
          python3 -m unittest \
            scripts.tests.test_change_impact \
            scripts.tests.test_chain_reconciliation \
            scripts.tests.test_release_assets \
            scripts.tests.test_release_components \
            scripts.tests.test_release_provenance \
            scripts.tests.test_phoenix_release \
            scripts.tests.test_phoenix_executor_rotation \
            scripts.tests.test_production_mode \
            scripts.tests.test_atlas_aave_fork_package \
            scripts.tests.test_atlas_aave_candidate_exact_validator \
            scripts.tests.test_atlas_aave_economic_prefilter \
            scripts.tests.test_atlas_aave_provider_preflight \
            scripts.tests.test_atlas_aave_provider_agreement \
            scripts.tests.test_atlas_shadow_validation \
            scripts.tests.test_atlas_liquidation_ground_truth \
            scripts.tests.test_atlas_borrower_index \
            scripts.tests.test_ethereum_state_proof \
            scripts.tests.test_export_aave_borrow_discovery \
            scripts.tests.test_export_aave_checkpoint \
            scripts.tests.test_verify_aave_borrow_archive
          sh ./scripts/required-service-absence-tests.sh
          sh ./scripts/production-compose-context-tests.sh
          sh ./scripts/phoenix-release-platform-tests.sh
          sh ./scripts/shadow-atlas-validation-tests.sh
          sh ./scripts/atlas-liquidation-ground-truth-tests.sh

      - name: Validate bounded Engine canary control on exact main
        if: ${{ steps.impact.outputs.job_hygiene == 'true' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          sh ./scripts/shadow-engine-canary-control-tests.sh
          sh ./scripts/shadow-engine-isolated-canary-tests.sh
          sh ./scripts/shadow-positive-route-evidence-tests.sh
          sh ./scripts/production-compose-context-tests.sh
          python3 -m py_compile scripts/shadow_profitability_report.py
          sh ./scripts/shadow-profitability-report-tests.sh
          python3 -m py_compile scripts/shadow_route_discovery.py
          sh ./scripts/shadow-route-discovery-tests.sh
          python3 -m py_compile scripts/prelive_money_path_report.py
          sh ./scripts/prelive-money-path-report-tests.sh
          python3 -m py_compile scripts/atlas_shadow_validation_report.py
          sh ./scripts/shadow-atlas-validation-tests.sh
          python3 -m unittest scripts.tests.test_atlas_shadow_validation
          python3 -m py_compile scripts/atlas_liquidation_ground_truth.py
          sh ./scripts/atlas-liquidation-ground-truth-tests.sh
          python3 -m unittest scripts.tests.test_atlas_liquidation_ground_truth
          python3 -m py_compile scripts/prelive_dashboard_snapshot.py scripts/verify_dashboard_compose.py
          python3 -m py_compile scripts/prelive_shadow_control.py scripts/prelive_dashboard_live.py
          sh ./scripts/prelive-shadow-control-tests.sh
          python3 -m py_compile scripts/release_assets.py scripts/phoenix_executor_rotation_context.py
          python3 -m unittest scripts.tests.test_release_assets scripts.tests.test_phoenix_executor_rotation
          sh ./scripts/rotate-phoenix-executor-live-tests.sh
          python3 -m py_compile scripts/change_impact.py
          python3 -m unittest scripts.tests.test_change_impact
          python3 -m py_compile scripts/phoenix_release/*.py
          python3 -m unittest \
            scripts.tests.test_chain_reconciliation \
            scripts.tests.test_phoenix_release \
            -v
          sh ./scripts/phoenix-release-platform-tests.sh
          python3 -m py_compile scripts/hunter_contracts.py
          python3 scripts/hunter_contracts.py validate-fixtures
          python3 -m unittest scripts.tests.test_hunter_contracts
          python3 scripts/hunter_contracts.py validate fixtures/hunter-a1/v1/autonomous-candidate.json
          python3 -m unittest scripts.tests.test_hunter_a1
          python3 -m py_compile scripts/release_components.py scripts/release_provenance.py scripts/prelive_v5_release.py scripts/production_mode.py scripts/anvil_quote_proxy.py
          python3 -m unittest scripts.tests.test_anvil_quote_proxy
          python3 -m unittest scripts.tests.test_production_mode
          python3 -m unittest scripts.tests.test_release_components scripts.tests.test_release_provenance scripts.tests.test_prelive_v5_release
          python3 -m py_compile scripts/phoenix_shadow_deploy.py
          python3 -m unittest scripts.tests.test_shadow_deploy_gateway
          sh ./scripts/shadow-deploy-gateway-tests.sh
          sh ./scripts/production-healthcheck-tests.sh
          sh ./scripts/required-service-absence-tests.sh
          sh ./scripts/production-release-context-compatibility-tests.sh
          sh ./scripts/prelive-v5-fresh-database-gate-tests.sh
          sh ./scripts/prelive-release-gate-tests.sh
          python3 -m py_compile scripts/prelive_protected_maintenance.py
          python3 -m unittest scripts.tests.test_prelive_protected_maintenance
          sh ./scripts/prelive-protected-maintenance-tests.sh
          sh ./scripts/prelive-protected-maintenance-supervisor-tests.sh
          python3 -m py_compile scripts/prelive_shadow_contract_transition.py
          python3 -m unittest scripts.tests.test_prelive_shadow_contract_transition
          sh ./scripts/production-bootstrap-safety-tests.sh
          sh ./scripts/autonomous-live-release-contract-tests.sh
          python3 -m unittest scripts.tests.test_live_executor_safety -v
          python3 -m py_compile \
            scripts/atlas_aave_fork_package.py \
            scripts/atlas_aave_candidate_exact_validator.py \
            scripts/atlas_aave_economic_prefilter.py \
            scripts/atlas_aave_provider_agreement.py \
            scripts/atlas_borrower_index.py \
            scripts/export_aave_borrow_discovery.py \
            scripts/export_aave_checkpoint.py \
            scripts/probe_aave_archive_provider.py \
            scripts/verify_aave_borrow_archive.py
          python3 -m unittest \
            scripts.tests.test_atlas_aave_fork_package \
            scripts.tests.test_atlas_aave_candidate_exact_validator \
            scripts.tests.test_atlas_aave_economic_prefilter \
            scripts.tests.test_atlas_aave_provider_agreement \
            scripts.tests.test_atlas_borrower_index \
            scripts.tests.test_export_aave_borrow_discovery \
            scripts.tests.test_export_aave_checkpoint \
            scripts.tests.test_verify_aave_borrow_archive \
            -v

      - name: Validate tracked hygiene
        if: ${{ steps.impact.outputs.job_hygiene == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env is tracked and must be removed from Git"
            exit 1
          fi
          bad_private="$(git ls-files | grep -Ei '(^|/)(keystore|keystores|wallets)(/|$)|\.(pem|key|pfx|p12|jks|keystore)$|UTC--|wallet.*\.(json|txt|wallet)$' || true)"
          bad_runtime="$(git ls-files | grep -Ei '(^|/)(postgres-data|postgres_data|pgdata|prometheus-data|prometheus_data|recordings|feed-recordings|replay-output|benchmark-output|bench-output|target|out|cache|broadcast|node_modules)(/|$)|\.(db|sqlite|sqlite3|db-wal|db-shm|ndjson\.zst|jsonl\.zst|prof|pprof|bench)$' || true)"
          if [ -n "$bad_private" ]; then
            echo "Private key or wallet-like files are tracked:"
            echo "$bad_private"
            exit 1
          fi
          if [ -n "$bad_runtime" ]; then
            echo "Runtime, recording, or build output files are tracked:"
            echo "$bad_runtime"
            exit 1
          fi

  go:
    name: go
    needs: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record deterministic no-op
        if: ${{ needs.hygiene.outputs.job_go != 'true' }}
        run: echo "go is unaffected by the canonical change-impact plan."

      - name: Checkout
        if: ${{ needs.hygiene.outputs.job_go == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go
        if: ${{ needs.hygiene.outputs.job_go == 'true' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: feed-ingestor/go.mod
          cache: true
          cache-dependency-path: |
            atlas-observer/go.sum
            feed-ingestor/go.mod
            migration-runner/go.sum

      - name: Verify atlas-observer
        if: ${{ needs.hygiene.outputs.job_go == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd atlas-observer
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi
          go vet ./...
          go test ./...

      - name: Verify feed-ingestor
        if: ${{ needs.hygiene.outputs.job_go == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd feed-ingestor
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi
          go vet ./...
          go test ./...

      - name: Verify migration-runner
        if: ${{ needs.hygiene.outputs.job_go == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd migration-runner
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi
          go vet ./...
          go test ./...

  rust-phoenix:
    name: rust-phoenix
    needs: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      nats:
        image: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
        ports:
          - 4222:4222
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: phoenix_test
          POSTGRES_PASSWORD: phoenix_test_password
          POSTGRES_DB: phoenix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phoenix_test -d phoenix_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Record deterministic no-op
        if: ${{ needs.hygiene.outputs.job_rust_phoenix != 'true' }}
        run: echo "rust-phoenix is unaffected by the canonical change-impact plan."

      - name: Checkout
        if: ${{ needs.hygiene.outputs.job_rust_phoenix == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust components
        if: ${{ needs.hygiene.outputs.job_rust_phoenix == 'true' }}
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Focused pull-request phoenix-engine check
        if: ${{ needs.hygiene.outputs.job_rust_phoenix == 'true' && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path phoenix-engine/Cargo.toml
          cargo check --locked --manifest-path phoenix-engine/Cargo.toml --all-targets

      - name: Verify phoenix-engine on exact main
        if: ${{ needs.hygiene.outputs.job_rust_phoenix == 'true' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path phoenix-engine/Cargo.toml
          cargo clippy --manifest-path phoenix-engine/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path phoenix-engine/Cargo.toml
          PHOENIX_TEST_POSTGRES_DSN=postgres://phoenix_test:phoenix_test_password@127.0.0.1:5432/phoenix_test \
            cargo test --locked --manifest-path phoenix-engine/Cargo.toml \
              --test postgres_decision_integration -- --nocapture
          docker run --rm --network host \
            -e PGPASSWORD=phoenix_test_password \
            postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 \
            psql -X -qAt -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U phoenix_test -d phoenix_test \
              -c "INSERT INTO schema_migrations(version, checksum) VALUES ('010_fork_simulation_evidence', repeat('a', 64)) ON CONFLICT (version) DO UPDATE SET checksum = EXCLUDED.checksum" \
            >/dev/null
          docker run --rm --network host \
            -e PGPASSWORD=phoenix_test_password \
            -v "$PWD/scripts/sql:/sql:ro" \
            postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 \
            psql -X -qAt -v ON_ERROR_STOP=1 \
              -v window_hours=24 \
              -v route_hash=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              -v evidence_start=1970-01-01T00:00:00Z \
              -h 127.0.0.1 -U phoenix_test -d phoenix_test \
              -f /sql/prelive-dashboard-source.sql \
            > /tmp/prelive-dashboard-source.json
          python3 scripts/prelive_dashboard_live.py validate-source \
            --input /tmp/prelive-dashboard-source.json

  rust-rpc-gateway:
    name: rust-rpc-gateway
    needs: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record deterministic no-op
        if: ${{ needs.hygiene.outputs.job_rust_rpc_gateway != 'true' }}
        run: echo "rust-rpc-gateway is unaffected by the canonical change-impact plan."

      - name: Checkout
        if: ${{ needs.hygiene.outputs.job_rust_rpc_gateway == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust components
        if: ${{ needs.hygiene.outputs.job_rust_rpc_gateway == 'true' }}
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Focused pull-request rpc-gateway check
        if: ${{ needs.hygiene.outputs.job_rust_rpc_gateway == 'true' && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path rpc-gateway/Cargo.toml
          cargo check --locked --manifest-path rpc-gateway/Cargo.toml --all-targets

      - name: Verify rpc-gateway on exact main
        if: ${{ needs.hygiene.outputs.job_rust_rpc_gateway == 'true' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path rpc-gateway/Cargo.toml
          cargo clippy --manifest-path rpc-gateway/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path rpc-gateway/Cargo.toml

  rust-recorder:
    name: rust-recorder
    needs: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: phoenix_test
          POSTGRES_PASSWORD: phoenix_test_password
          POSTGRES_DB: phoenix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phoenix_test -d phoenix_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Record deterministic no-op
        if: ${{ needs.hygiene.outputs.job_rust_recorder != 'true' }}
        run: echo "rust-recorder is unaffected by the canonical change-impact plan."

      - name: Checkout
        if: ${{ needs.hygiene.outputs.job_rust_recorder == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust components
        if: ${{ needs.hygiene.outputs.job_rust_recorder == 'true' }}
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Focused pull-request recorder check
        if: ${{ needs.hygiene.outputs.job_rust_recorder == 'true' && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path recorder/Cargo.toml
          cargo check --locked --manifest-path recorder/Cargo.toml --all-targets

      - name: Verify recorder on exact main
        if: ${{ needs.hygiene.outputs.job_rust_recorder == 'true' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check --manifest-path money-path-classifier/Cargo.toml
          cargo clippy --manifest-path money-path-classifier/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path money-path-classifier/Cargo.toml --all-targets --all-features --locked
          cargo fmt --check --manifest-path recorder/Cargo.toml
          cargo clippy --manifest-path recorder/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path recorder/Cargo.toml
          PHOENIX_TEST_POSTGRES_DSN=postgres://phoenix_test:phoenix_test_password@127.0.0.1:5432/phoenix_test \
            cargo test --locked --manifest-path recorder/Cargo.toml \
              --test postgres_outbox_integration -- --nocapture
          PHOENIX_TEST_POSTGRES_DSN=postgres://phoenix_test:phoenix_test_password@127.0.0.1:5432/phoenix_test \
          PHOENIX_STORAGE_BENCHMARK_INPUTS=100000 \

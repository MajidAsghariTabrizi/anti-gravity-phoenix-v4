name: Phoenix Release Controller

on:
  workflow_run:
    workflows: ["Phoenix CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA to resume or release
        required: true
        type: string
      source_ci_run_id:
        description: Exact successful Phoenix CI main-push run
        required: true
        type: string
      source_ci_run_attempt:
        description: Exact successful Phoenix CI attempt
        required: true
        default: "1"
        type: string
      recovery_confirm:
        description: Explicit recovery-only dispatch confirmation
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: phoenix-production-release
  cancel-in-progress: false

env:
  PHOENIX_RELEASE_IMAGE_SET: current

jobs:
  prepare:
    name: verify-release-eligibility
    if: ${{ vars.PHOENIX_AUTORELEASE_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.request.outputs.release_sha }}
      source_ci_run_id: ${{ steps.request.outputs.source_ci_run_id }}
      source_ci_run_attempt: ${{ steps.request.outputs.source_ci_run_attempt }}
      should_release: ${{ steps.impact.outputs.should_release }}
      impact_plan: ${{ steps.impact.outputs.plan }}
      build_required: ${{ steps.existing.outputs.build_required }}
      build_run_id: ${{ steps.existing.outputs.build_run_id }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact source CI request
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_SHA: ${{ inputs.release_sha }}
          DISPATCH_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          DISPATCH_CI_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          DISPATCH_RECOVERY_CONFIRM: ${{ inputs.recovery_confirm }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run)
              release_sha="$(jq -er '.workflow_run.head_sha' "$EVENT_PATH")"
              source_ci_run_id="$(jq -er '.workflow_run.id' "$EVENT_PATH")"
              source_ci_run_attempt="$(jq -er '.workflow_run.run_attempt' "$EVENT_PATH")"
              [ "$(jq -er '.workflow_run.conclusion' "$EVENT_PATH")" = success ]
              [ "$(jq -er '.workflow_run.head_branch' "$EVENT_PATH")" = main ]
              [ "$(jq -er '.workflow_run.repository.full_name' "$EVENT_PATH")" = "$GITHUB_REPOSITORY" ]
              ;;
            workflow_dispatch)
              [ "$DISPATCH_RECOVERY_CONFIRM" = RECOVER_EXACT_PHOENIX_RELEASE ]
              release_sha="$DISPATCH_SHA"
              source_ci_run_id="$DISPATCH_CI_RUN_ID"
              source_ci_run_attempt="$DISPATCH_CI_ATTEMPT"
              ;;
            *)
              echo "unsupported trigger"
              exit 1
              ;;
          esac
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_ci_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_ci_run_attempt" =~ ^[1-9][0-9]*$ ]]
          current_main="$(git rev-parse origin/main)"
          [ "$release_sha" = "$current_main" ] || {
            echo "release SHA is not the exact protected main tip"
            exit 1
          }
          printf 'release_sha=%s\n' "$release_sha" >>"$GITHUB_OUTPUT"
          printf 'source_ci_run_id=%s\n' "$source_ci_run_id" >>"$GITHUB_OUTPUT"
          printf 'source_ci_run_attempt=%s\n' "$source_ci_run_attempt" >>"$GITHUB_OUTPUT"

      - name: Verify every required source CI job
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.request.outputs.release_sha }}
          SOURCE_CI_RUN_ID: ${{ steps.request.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.request.outputs.source_ci_run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p source-ci
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}/attempts/${SOURCE_CI_RUN_ATTEMPT}" \
            >source-ci/run.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}/attempts/${SOURCE_CI_RUN_ATTEMPT}/jobs?per_page=100" \
            >source-ci/jobs.json
          python3 -m scripts.phoenix_release.controller verify-source-ci \
            --run source-ci/run.json \
            --jobs source-ci/jobs.json \
            --repository "$GITHUB_REPOSITORY" \
            --expected-sha "$RELEASE_SHA" \
            --run-id "$SOURCE_CI_RUN_ID" \
            --run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --current-main-sha "$(git rev-parse origin/main)" \
            >source-ci/controller-evidence.json

      - name: Classify release impact
        id: impact
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.request.outputs.release_sha }}
        run: |
          set -euo pipefail
          python3 scripts/change_impact.py git \
            --base "${RELEASE_SHA}^1" \
            --head "$RELEASE_SHA" \
            --output change-impact.json
          printf 'plan=%s\n' "$(jq -c . change-impact.json)" >>"$GITHUB_OUTPUT"
          if [ "$(jq -r '.release_required' change-impact.json)" != true ]; then
            echo "should_release=false" >>"$GITHUB_OUTPUT"
            echo "docs-only change: no production release created." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "should_release=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Locate an existing exact-SHA immutable build
        id: existing
        if: ${{ steps.impact.outputs.should_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.request.outputs.release_sha }}
        run: |
          set -euo pipefail
          artifacts="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=phoenix-release-manifest-${RELEASE_SHA}&per_page=100"
          )"
          build_run_id="$(
            jq -r \
              '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty' \
              <<<"$artifacts"
          )"
          if [ -n "$build_run_id" ]; then
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${build_run_id}")"
            if [ "$(jq -r '.head_sha' <<<"$run")" = "$RELEASE_SHA" ] &&
              [ "$(jq -r '.status' <<<"$run")" = completed ] &&
              [ "$(jq -r '.repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY" ]
            then
              run_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${build_run_id}/attempts/1/jobs?per_page=100")"
              build_jobs="$(jq -r '[.jobs[] | select(.name | startswith("immutable-build/"))]' <<<"$run_jobs")"
              if [ "$(jq -r '.conclusion' <<<"$run")" = success ] ||
                { [ "$(jq -r 'length' <<<"$build_jobs")" -gt 0 ] &&
                  [ "$(jq -r '[.[] | select(.conclusion != "success")] | length' <<<"$build_jobs")" = 0 ]; }
              then
                printf 'build_required=false\nbuild_run_id=%s\n' \
                  "$build_run_id" >>"$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          printf 'build_required=true\nbuild_run_id=%s\n' \
            "$GITHUB_RUN_ID" >>"$GITHUB_OUTPUT"

      - name: Publish canonical release impact plan
        if: ${{ steps.impact.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phoenix-release-impact-${{ steps.request.outputs.release_sha }}
          path: change-impact.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: immutable-build
    needs: [prepare, host-plan]
    if: ${{ needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.build_required == 'true' && needs.host-plan.outputs.already_active != 'true' }}
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      release_sha: ${{ needs.prepare.outputs.release_sha }}
      release_intent: PHOENIX_PRELIVE_SHADOW_V5
      confirm_publish: PUBLISH_IMMUTABLE_PHOENIX_IMAGES
      ci_run_id: ${{ needs.prepare.outputs.source_ci_run_id }}
      ci_run_attempt: ${{ needs.prepare.outputs.source_ci_run_attempt }}
      protected_base_sha: ${{ needs.host-plan.outputs.rollback_sha }}
      protected_base_build_run_id: ${{ needs.host-plan.outputs.rollback_build_run_id }}
    secrets: inherit

  host-plan:
    name: read-active-release-plan
    needs: prepare
    if: ${{ needs.prepare.outputs.should_release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-live
    permissions:
      contents: read
    outputs:
      rollback_sha: ${{ steps.active.outputs.rollback_sha }}
      rollback_build_run_id: ${{ steps.active.outputs.rollback_build_run_id }}
      already_active: ${{ steps.active.outputs.already_active }}
    steps:
      - name: Checkout exact protected main host plan
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install restricted SSH identity
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$PROD_SSH_PRIVATE_KEY" ] && [ -n "$PROD_KNOWN_HOSTS" ]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" >"$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read active immutable release
        id: active
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          [ "$PROD_USER" = phoenix-deploy ]
          [[ "$PROD_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PROD_PORT" =~ ^[1-9][0-9]{0,4}$ ]]
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PROD_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
          )
          ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" status >active.json
          rollback_sha="$(jq -er '.active_release' active.json)"
          rollback_build_run_id="$(jq -er '.active_build_run_id' active.json)"
          [[ "$rollback_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$rollback_build_run_id" =~ ^[1-9][0-9]*$ ]]
          [ "$rollback_sha" != 8f6a1c362773ba9e764954883402b0d6c7375349 ]
          readiness_rc=0
          ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" \
            "readiness ${RELEASE_SHA}" \
            >production-readiness-output.json \
            2>production-readiness-error.json || readiness_rc=$?
          if [ "$readiness_rc" -eq 0 ]; then
            [ ! -s production-readiness-error.json ]
            jq -e --arg sha "$RELEASE_SHA" \
              '.candidate_sha == $sha and .status == "passed" and .failure_count == 0' \
              production-readiness-output.json >/dev/null
            mv production-readiness-output.json production-readiness.json
          else
            # One-time bootstrap for the exact installed seven-image LIVE
            # generation. The candidate gateway fixes this false-positive but
            # cannot be installed until the protected release succeeds. Accept
            # only the known active topology with every real service healthy,
            # the executor stopped, safe controls, and Atlas as the sole error.
            [ "$readiness_rc" -eq 1 ]
            [ ! -s production-readiness-output.json ]
            if jq -e \
              --arg sha "$RELEASE_SHA" \
              --arg rollback "$rollback_sha" \
              --arg bootstrap "899daa33b99863f5076bd9b39b6237da19865a5f" \
              '
                .code == "PRODUCTION_READINESS_FAILED" and
                .phase == "GATEWAY" and
                .status == "error" and
                .evidence.candidate_sha == $sha and
                .evidence.status == "failed" and
                .evidence.failure_count == 1 and
                .evidence.failures == [{
                  "code": "READINESS_SERVICE_MISSING",
                  "evidence": {"service": "atlas-observer"}
                }] and
                $rollback == $bootstrap and
                .evidence.checks.active_release.active_release == $rollback and
                .evidence.checks.active_release.phoenix_mode == "LIVE" and
                .evidence.checks.active_release.live_execution == true and
                .evidence.checks.active_release.autonomous_execution == true and
                .evidence.checks.release_platform.installed_sha == $rollback and
                .evidence.checks.release_platform.upgrade_required == true and
                .evidence.checks.controls.armed == false and
                .evidence.checks.controls.execution_mode == "disarmed" and
                .evidence.checks.controls.kill_switch == true and
                .evidence.checks.controls.active_attempts == 0 and
                .evidence.checks.controls.open_routes == 0 and
                .evidence.checks.controls.unresolved_submissions == 0 and
                .evidence.checks.contract.contract_paused == true and
                .evidence.checks.contract.owner_transaction_hash == null and
                ([.evidence.checks.services[].service] | sort) == [
                  "dashboard",
                  "economic-monitor",
                  "economic-supervisor",
                  "feed-ingestor",
                  "live-executor",
                  "nats",
                  "nitro-feed-relay",
                  "phoenix-engine",
                  "postgres",
                  "prometheus",
                  "recorder",
                  "rpc-gateway",
                  "shadow-dispatcher"
                ] and
                ([
                  .evidence.checks.services[] |
                  select(.service != "live-executor") |
                  (.running == true and .health == "healthy")
                ] | all) and
                ([
                  .evidence.checks.services[] |
                  select(.service == "live-executor")
                ] == [{
                  "container_id": null,
                  "service": "live-executor",
                  "state": "stopped"
                }])
              ' production-readiness-error.json >/dev/null; then
              jq \
                --arg sha "$RELEASE_SHA" \
                --arg rollback "$rollback_sha" \
                '{
                  schema: "phoenix.production-readiness-bootstrap.v1",
                  candidate_sha: $sha,
                  status: "passed",
                  failure_count: 0,
                  bootstrap: {
                    active_release: $rollback,
                    accepted_false_positive: "atlas-observer",
                    raw_gateway_evidence: .
                  }
                }' production-readiness-error.json >production-readiness.json
            elif jq -e \
              --arg sha "$RELEASE_SHA" \
              --arg rollback "$rollback_sha" \
              --arg monitor_recovery_active "8ac529a9af7caeacb8883a51024e5970dae6f281" \
              '
                $rollback == $monitor_recovery_active and
                .code == "PRODUCTION_READINESS_FAILED" and
                .phase == "GATEWAY" and
                .status == "error" and
                .evidence.schema == "phoenix.production-readiness.v1" and
                .evidence.candidate_sha == $sha and
                .evidence.status == "failed" and
                .evidence.failure_count == 1 and
                (.evidence.failures | length) == 1 and
                .evidence.failures[0].code == "READINESS_SERVICE_UNHEALTHY" and
                .evidence.failures[0].evidence.service == "economic-monitor" and
                .evidence.failures[0].evidence.health == "unhealthy" and
                .evidence.failures[0].evidence.running == true and
                (
                  .evidence.failures[0].evidence.configured_image
                  | startswith("postgres@sha256:")
                ) and
                .evidence.checks.active_release.active_release == $rollback and
                .evidence.checks.active_release.release_assets_sha == $rollback and
                .evidence.checks.active_release.phoenix_mode == "LIVE" and
                .evidence.checks.active_release.live_execution == true and
                .evidence.checks.active_release.autonomous_execution == true and
                .evidence.checks.release_platform.installed_sha == $rollback and
                .evidence.checks.release_platform.upgrade_required == true and
                .evidence.checks.contract.contract_paused == true and
                .evidence.checks.contract.owner_transaction_hash == null and
                .evidence.checks.controls.armed == false and
                .evidence.checks.controls.execution_mode == "disarmed" and
                .evidence.checks.controls.kill_switch == true and
                .evidence.checks.controls.active_attempts == 0 and
                .evidence.checks.controls.open_routes == 0 and
                .evidence.checks.controls.unresolved_submissions == 0 and
                .evidence.checks.controls.submission_lock_free == true and
                .evidence.checks.controls.outbox_pending == 0 and
                .evidence.checks.controls.outbox_claimable == 0 and
                .evidence.checks.controls.outbox_ack_pending == 0 and
                .evidence.checks.controls.aave_armed == false and
                .evidence.checks.controls.aave_kill_switch == true and
                .evidence.checks.controls.atlas_armed == false and
                .evidence.checks.controls.atlas_kill_switch == true and
                .evidence.checks.controls.active_atlas == 0 and
                ([.evidence.checks.services[].service] | sort) == [
                  "atlas-observer",
                  "dashboard",
                  "economic-monitor",
                  "economic-supervisor",
                  "feed-ingestor",
                  "live-executor",
                  "nats",
                  "nitro-feed-relay",
                  "phoenix-engine",
                  "postgres",
                  "prometheus",
                  "recorder",
                  "rpc-gateway",
                  "shadow-dispatcher"
                ] and
                ([
                  .evidence.checks.services[]
                  | select(.service != "economic-monitor")
                  | (.running == true and .health == "healthy")
                ] | all) and
                ([
                  .evidence.checks.services[]
                  | select(.service == "economic-monitor")
                ] | length == 1 and .[0].running == true and .[0].health == "unhealthy")
              ' production-readiness-error.json >/dev/null; then
              # One-time economic-monitor recovery bridge for the exact LIVE
              # 8ac529a generation. The candidate fixes the monitor statement-
              # timeout defect but cannot be installed while the old monitor
              # container fails its health probe. Accept only the exact known
              # active release, fail-closed controls, a paused contract, the
              # full healthy topology, and economic-monitor as the sole
              # readiness failure.
              jq \
                --arg sha "$RELEASE_SHA" \
                --arg rollback "$rollback_sha" \
                '{
                  schema: "phoenix.production-readiness-monitor-recovery.v1",
                  candidate_sha: $sha,
                  status: "passed",
                  failure_count: 0,
                  monitor_recovery: {
                    active_release: $rollback,
                    accepted_false_positive: "economic-monitor",
                    raw_gateway_evidence: .
                  }
                }' production-readiness-error.json >production-readiness.json
            else
              # Exact one-time forward-fix bridge for the 3bf hunter-state
              # compatibility incident. The old 1776 observer cannot load the
              # forward-written scheduling reasons, while the protected-main
              # candidate contains the sanitizing fix. No other readiness
              # defect or runtime topology is accepted.
              ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" \
                "evidence 3bf4202cfe8233f301a5c381423774c9c1f7ab56" \
                >forward-fix-failed-release.json
              python3 - \
                "$RELEASE_SHA" \
                "$rollback_sha" \
                production-readiness-error.json \
                forward-fix-failed-release.json \
                production-readiness.json <<'PY'
          # FORWARD_FIX_BOOTSTRAP_VALIDATOR_BEGIN
          import hashlib
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          CANDIDATE_ANCESTOR = "5f2593a37064bf5dcabd4d9c6341a19bf548322f"
          ACTIVE_RELEASE = "1776be2f7e9d2921589e4b4eb0faf5fe057e38fb"
          ACTIVE_BUILD_RUN_ID = 31874086597
          FAILED_RELEASE = "3bf4202cfe8233f301a5c381423774c9c1f7ab56"
          OLD_ATLAS_IMAGE = (
              "ghcr.io/majidasgharitabrizi/atlas-observer@sha256:"
              "074b9e5ea4ce6cdedac52f3bf462193533521f90d318e8ef335f513feb1c2a58"
          )
          OLD_ATLAS_IMAGE_ID = (
              "sha256:074b9e5ea4ce6cdedac52f3bf462193533521f90d318e8ef335f513feb1c2a58"
          )
          EXPECTED_SERVICES = {
              "atlas-observer",
              "dashboard",
              "feed-ingestor",
              "nats",
              "nitro-feed-relay",
              "phoenix-engine",
              "postgres",
              "prometheus",
              "recorder",
              "rpc-gateway",
              "shadow-dispatcher",
          }

          def require(condition, code):
              if not condition:
                  raise SystemExit(f"FORWARD_FIX_BOOTSTRAP_REJECTED:{code}")

          def read_json(path):
              payload = Path(path).read_bytes()
              require(0 < len(payload) <= 1024 * 1024, "evidence_size")
              try:
                  value = json.loads(payload)
              except (UnicodeDecodeError, json.JSONDecodeError):
                  require(False, "evidence_json")
              require(isinstance(value, dict), "evidence_shape")
              return value, payload

          candidate_sha, rollback_sha, raw_path, failed_path, output_path = sys.argv[1:]
          require(re.fullmatch(r"[0-9a-f]{40}", candidate_sha), "candidate_sha")
          require(rollback_sha == ACTIVE_RELEASE, "rollback_release")
          head = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          require(head == candidate_sha, "candidate_not_protected_main")
          ancestry = subprocess.run(
              ["git", "merge-base", "--is-ancestor", CANDIDATE_ANCESTOR, candidate_sha],
              check=False,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          require(ancestry.returncode == 0, "candidate_missing_forward_fix")

          raw, _ = read_json(raw_path)
          failed, failed_payload = read_json(failed_path)
          require(raw.get("code") == "PRODUCTION_READINESS_FAILED", "gateway_code")
          require(raw.get("phase") == "GATEWAY", "gateway_phase")
          require(raw.get("status") == "error", "gateway_status")
          readiness = raw.get("evidence")
          require(isinstance(readiness, dict), "readiness_shape")
          require(readiness.get("schema") == "phoenix.production-readiness.v1", "readiness_schema")
          require(readiness.get("candidate_sha") == candidate_sha, "readiness_candidate")
          require(readiness.get("status") == "failed", "readiness_status")
          failures = readiness.get("failures")
          require(readiness.get("failure_count") == 1, "readiness_failure_count")
          require(isinstance(failures, list) and len(failures) == 1, "readiness_failures")
          accepted_failure = failures[0]
          require(
              isinstance(accepted_failure, dict)
              and accepted_failure.get("code") == "READINESS_SERVICE_UNHEALTHY",
              "accepted_failure_code",
          )

          checks = readiness.get("checks")
          require(isinstance(checks, dict), "checks_shape")
          active = checks.get("active_release")
          require(
              active == {
                  "active_build_run_id": ACTIVE_BUILD_RUN_ID,
                  "active_release": ACTIVE_RELEASE,
                  "autonomous_execution": False,
                  "live_execution": False,
                  "phoenix_mode": "SHADOW",
                  "protocol_version": "phoenix-release.v1",
                  "release_assets_sha": ACTIVE_RELEASE,
                  "schema": "phoenix.release-status.v1",
              },
              "active_release_identity",
          )
          require(
              checks.get("release_platform", {}).get("installed_sha") == FAILED_RELEASE
              and checks.get("release_platform", {}).get("upgrade_required") is True,
              "installed_platform_identity",
          )
          require(
              checks.get("contract")
              == {"contract_paused": True, "owner_transaction_hash": None},
              "contract_not_historically_safe",
          )
          controls = checks.get("controls")
          required_controls = {
              "aave_armed": False,
              "aave_kill_switch": True,
              "active_atlas": 0,
              "active_attempts": 0,
              "armed": False,
              "atlas_armed": False,
              "atlas_kill_switch": True,
              "execution_mode": "disarmed",
              "kill_switch": True,
              "open_routes": 0,
              "submission_lock_free": True,
              "unresolved_submissions": 0,
          }
          require(
              isinstance(controls, dict)
              and all(controls.get(key) == value for key, value in required_controls.items()),
              "controls_not_fail_closed",
          )

          expected = checks.get("expected_services")
          services = checks.get("services")
          require(isinstance(expected, list) and set(expected) == EXPECTED_SERVICES, "expected_services")
          require(isinstance(services, list), "services_shape")
          by_name = {
              item.get("service"): item
              for item in services
              if isinstance(item, dict) and isinstance(item.get("service"), str)
          }
          require(len(by_name) == len(services), "duplicate_service")
          require(set(by_name) == EXPECTED_SERVICES, "service_topology")
          require("live-executor" not in by_name, "live_executor_running")
          for name, service in by_name.items():
              configured = service.get("configured_image")
              image_id = service.get("image_id")
              require(
                  isinstance(configured, str)
                  and "@sha256:" in configured
                  and configured.rsplit("@", 1)[-1] == image_id,
                  f"service_identity_{name}",
              )
              require(
                  isinstance(service.get("container_id"), str)
                  and re.fullmatch(r"[0-9a-f]{64}", service["container_id"]),
                  f"service_container_{name}",
              )
              if name != "atlas-observer":
                  require(
                      service.get("running") is True and service.get("health") == "healthy",
                      f"second_unhealthy_service_{name}",
                  )
          atlas = by_name["atlas-observer"]
          require(atlas.get("configured_image") == OLD_ATLAS_IMAGE, "atlas_configured_image")
          require(atlas.get("image_id") == OLD_ATLAS_IMAGE_ID, "atlas_image_id")
          require(atlas.get("running") is True, "atlas_not_restart_loop")
          require(atlas.get("health") in {"starting", "unhealthy"}, "atlas_health")
          state_mounts = [
              mount
              for mount in atlas.get("mounts", [])
              if isinstance(mount, dict)
              and mount.get("destination") == "/var/lib/phoenix-atlas-observer"
              and mount.get("source") == "/opt/phoenix/evidence/atlas-live"
              and mount.get("type") == "bind"
          ]
          require(len(state_mounts) == 1, "atlas_state_mount")
          require(accepted_failure.get("evidence") == atlas, "atlas_failure_evidence")

          require(failed.get("release_sha") == FAILED_RELEASE, "failed_release")
          require(failed.get("current_phase") == "ROLLBACK_FAILED", "failed_release_phase")
          require(failed.get("rollback_sha") == ACTIVE_RELEASE, "failed_release_rollback")
          require(failed.get("active_release_pointer") == ACTIVE_RELEASE, "failed_active_pointer")
          require(failed.get("candidate_pointer") == FAILED_RELEASE, "failed_candidate_pointer")
          require(failed.get("owner_transaction_hash") is None, "failed_owner_transaction")
          require(failed.get("contract_paused") is True, "failed_contract_unpaused")
          require(failed.get("autonomous_armed") is False, "failed_authority_armed")
          require(failed.get("kill_switch") is True, "failed_kill_switch")
          require(failed.get("mutation_started") is True, "failed_mutation_identity")
          require(failed.get("failure_phase") == "POST_DISARMED_VERIFYING", "failed_failure_phase")
          failure_evidence = failed.get("failure_evidence")
          require(isinstance(failure_evidence, dict), "failed_failure_evidence")
          failure_stdout = failure_evidence.get("stdout")
          require(isinstance(failure_stdout, str), "failed_failure_stdout")
          require(
              "existing route-ineligible state is invalid" in failure_stdout,
              "poisoned_state_signature",
          )

          result = {
              "schema": "phoenix.production-readiness-forward-fix-bootstrap.v1",
              "candidate_sha": candidate_sha,
              "status": "passed",
              "failure_count": 0,
              "active_release": ACTIVE_RELEASE,
              "failed_release_sha": FAILED_RELEASE,
              "failed_release_phase": "ROLLBACK_FAILED",
              "accepted_service": "atlas-observer",
              "accepted_failure_code": accepted_failure["code"],
              "controls_fail_closed": True,
              "contract_paused": True,
              "zero_work": True,
              "owner_transaction_absent": True,
              "failed_release_evidence_sha256": (
                  "sha256:" + hashlib.sha256(failed_payload).hexdigest()
              ),
              "raw_gateway_evidence": raw,
          }
          Path(output_path).write_text(
              json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          # FORWARD_FIX_BOOTSTRAP_VALIDATOR_END
          PY
              rm -f forward-fix-failed-release.json
            fi
          fi
          rm -f production-readiness-output.json production-readiness-error.json
          printf 'rollback_sha=%s\n' "$rollback_sha" >>"$GITHUB_OUTPUT"
          printf 'rollback_build_run_id=%s\n' "$rollback_build_run_id" >>"$GITHUB_OUTPUT"
          if [ "$rollback_sha" = "$RELEASE_SHA" ]; then
            echo "already_active=true" >>"$GITHUB_OUTPUT"
          else
            echo "already_active=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload aggregated Production readiness
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phoenix-production-readiness-${{ needs.prepare.outputs.release_sha }}
          path: production-readiness.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: deploy-through-release-gateway
    needs: [prepare, host-plan, build]
    if: ${{ always() && needs.prepare.result == 'success' && needs.host-plan.result == 'success' && needs.prepare.outputs.should_release == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: production-live
    permissions:
      actions: read
      contents: read
      deployments: write
    steps:
      - name: Checkout exact protected main release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install restricted SSH identity
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$PROD_SSH_PRIVATE_KEY" ] && [ -n "$PROD_KNOWN_HOSTS" ]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" >"$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read active rollback identity through the gateway
        id: active
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          [ "$PROD_USER" = phoenix-deploy ]
          [[ "$PROD_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PROD_PORT" =~ ^[1-9][0-9]{0,4}$ ]]
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PROD_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
          )
          ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" status >active.json
          rollback_sha="$(jq -er '.active_release' active.json)"
          rollback_build_run_id="$(jq -er '.active_build_run_id' active.json)"
          [[ "$rollback_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$rollback_build_run_id" =~ ^[1-9][0-9]*$ ]]
          [ "$rollback_sha" = "${{ needs.host-plan.outputs.rollback_sha }}" ]
          [ "$rollback_build_run_id" = "${{ needs.host-plan.outputs.rollback_build_run_id }}" ]
          if [ "$rollback_sha" = "$RELEASE_SHA" ]; then
            echo "already_active=true" >>"$GITHUB_OUTPUT"
            echo "Exact release is already active; deployment is idempotently complete." \
              >>"$GITHUB_STEP_SUMMARY"
          else
            echo "already_active=false" >>"$GITHUB_OUTPUT"
          fi
          printf 'rollback_sha=%s\n' "$rollback_sha" >>"$GITHUB_OUTPUT"
          printf 'rollback_build_run_id=%s\n' "$rollback_build_run_id" >>"$GITHUB_OUTPUT"

      - name: Probe durable exact-package evidence
        id: received
        if: ${{ steps.active.outputs.already_active != 'true' }}
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          SOURCE_CI_RUN_ID: ${{ needs.prepare.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.prepare.outputs.source_ci_run_attempt }}
          BUILD_RUN_ID: ${{ needs.prepare.outputs.build_run_id }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PROD_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
          )
          if ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" \
            "evidence ${RELEASE_SHA}" >existing-evidence.json 2>/dev/null &&
            jq -e \
              --arg sha "$RELEASE_SHA" \
              --argjson source "$SOURCE_CI_RUN_ID" \
              --argjson attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --argjson build "$BUILD_RUN_ID" \
              '
                .release_sha == $sha
                and .source_ci_run_id == $source
                and .source_ci_run_attempt == $attempt
                and .build_run_id == $build
                and (.package_digest | test("^sha256:[0-9a-f]{64}$"))
              ' existing-evidence.json >/dev/null
          then
            echo "found=true" >>"$GITHUB_OUTPUT"
            printf 'package_digest=%s\n' \
              "$(jq -er '.package_digest' existing-evidence.json)" >>"$GITHUB_OUTPUT"
          else
            rm -f existing-evidence.json
            echo "found=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Download exact release manifest
        if: ${{ steps.active.outputs.already_active != 'true' && steps.received.outputs.found != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phoenix-release-manifest-${{ needs.prepare.outputs.release_sha }}
          run-id: ${{ needs.prepare.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: package

      - name: Download exact release assets
        if: ${{ steps.active.outputs.already_active != 'true' && steps.received.outputs.found != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phoenix-release-assets-${{ needs.prepare.outputs.release_sha }}
          run-id: ${{ needs.prepare.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: package

      - name: Download immutable rollback evidence
        if: ${{ steps.active.outputs.already_active != 'true' && steps.received.outputs.found != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phoenix-release-manifest-${{ steps.active.outputs.rollback_sha }}
          run-id: ${{ steps.active.outputs.rollback_build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rollback

      - name: Create GitHub deployment
        id: deployment
        if: ${{ steps.active.outputs.already_active != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          deployment_id="$(
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              -f ref="$RELEASE_SHA" \
              -f environment=production-live \
              -f description="Phoenix automated production release" \
              -F auto_merge=false \
              --jq '.id'
          )"
          printf 'id=%s\n' "$deployment_id" >>"$GITHUB_OUTPUT"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state=in_progress \
            -f environment=production-live \
            -f description="Immutable build verified; host release started" >/dev/null

      - name: Verify, package, receive, and resume
        id: release
        if: ${{ steps.active.outputs.already_active != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          SOURCE_CI_RUN_ID: ${{ needs.prepare.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.prepare.outputs.source_ci_run_attempt }}
          BUILD_RUN_ID: ${{ needs.prepare.outputs.build_run_id }}
          ROLLBACK_SHA: ${{ steps.active.outputs.rollback_sha }}
          ROLLBACK_BUILD_RUN_ID: ${{ steps.active.outputs.rollback_build_run_id }}
          EXISTING_PACKAGE: ${{ steps.received.outputs.found }}
          EXISTING_PACKAGE_DIGEST: ${{ steps.received.outputs.package_digest }}
          PHOENIX_RPC_PROVIDER_SLOT_1_API_KEY: ${{ secrets.PHOENIX_RPC_PROVIDER_SLOT_1_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$PHOENIX_RPC_PROVIDER_SLOT_1_API_KEY" ]
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PROD_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=8
          )

          if [ "$EXISTING_PACKAGE" = true ]; then
            cp existing-evidence.json receive-evidence.json
            package_digest="$EXISTING_PACKAGE_DIGEST"
          else
            cp rollback/release-manifest.json package/rollback-manifest.json
            cp rollback/release-provenance.json package/rollback-provenance.json
            python3 -m scripts.phoenix_release.controller verify-source-ci \
              --run <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}/attempts/${SOURCE_CI_RUN_ATTEMPT}") \
              --jobs <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}/attempts/${SOURCE_CI_RUN_ATTEMPT}/jobs?per_page=100") \
              --repository "$GITHUB_REPOSITORY" \
              --expected-sha "$RELEASE_SHA" \
              --run-id "$SOURCE_CI_RUN_ID" \
              --run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --current-main-sha "$RELEASE_SHA" >/dev/null
            python3 scripts/release_assets.py verify \
              --archive "package/phoenix-release-assets-${RELEASE_SHA}.tar.gz" \
              --manifest package/release-assets-manifest.json \
              --checksums package/release-assets-checksums.txt \
              --expected-sha "$RELEASE_SHA"
            python3 scripts/release_provenance.py validate-deploy-pair \
              --release-manifest package/release-manifest.json \
              --release-provenance package/release-provenance.json \
              --release-sha "$RELEASE_SHA" \
              --build-run-id "$BUILD_RUN_ID" \
              --rollback-manifest package/rollback-manifest.json \
              --rollback-provenance package/rollback-provenance.json \
              --rollback-sha "$ROLLBACK_SHA" \
              --rollback-build-run-id "$ROLLBACK_BUILD_RUN_ID"
          python3 scripts/change_impact.py git \
            --base "$ROLLBACK_SHA" \
            --head "$RELEASE_SHA" \
            --output deployment-impact.json
          python3 scripts/release_components.py \
            resolve-protected-build-plan \
            --plan deployment-impact.json \
            --protected-base-manifest package/rollback-manifest.json \
            >deployment-impact.resolved.json
          mv deployment-impact.resolved.json deployment-impact.json
          [ "$(jq -c '.built_images' deployment-impact.json)" = \
            "$(jq -c '.built_images' package/release-provenance.json)" ]
            [ "$(jq -c '.inherited_images' deployment-impact.json)" = \
              "$(jq -c '.inherited_images' package/release-provenance.json)" ]
            python3 - "$RELEASE_SHA" "$ROLLBACK_SHA" "$SOURCE_CI_RUN_ID" \
              "$SOURCE_CI_RUN_ATTEMPT" "$BUILD_RUN_ID" \
              "$ROLLBACK_BUILD_RUN_ID" "$SOURCE_CI_RUN_ID" \
              "$SOURCE_CI_RUN_ATTEMPT" \
              >package/request.json <<'PY'
          import json
          import sys
          from scripts.phoenix_release import PROTOCOL_VERSION

          keys = (
              "release_sha",
              "rollback_sha",
              "source_ci_run_id",
              "source_ci_run_attempt",
              "build_run_id",
              "rollback_build_run_id",
              "deploy_run_id",
              "deploy_run_attempt",
          )
          values = sys.argv[1:]
          request = dict(zip(keys, values, strict=True))
          for key in keys[2:]:
              request[key] = int(request[key])
          request.update(
              schema="phoenix.release-request.v1",
              protocol_version=PROTOCOL_VERSION,
          )
          print(json.dumps(request, indent=2, sort_keys=True))
          PY
            (
              cd package
              tar --create --file - \
                --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
                "phoenix-release-assets-${RELEASE_SHA}.tar.gz" \
                release-assets-checksums.txt release-assets-manifest.json \
                release-manifest.json release-provenance.json request.json \
                rollback-manifest.json rollback-provenance.json |
                gzip -n >../release-package.tar.gz
            )
            package_digest="sha256:$(sha256sum release-package.tar.gz | cut -d' ' -f1)"
            cat release-package.tar.gz |
              ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" \
                "receive ${RELEASE_SHA}" >receive-evidence.json
            jq -e --arg digest "$package_digest" \
              '.package_digest == $digest' \
              <(
                ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" \
                  "evidence ${RELEASE_SHA}"
              ) >/dev/null
          fi
          [[ "$package_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$package_digest" >package-digest.txt
          existing_phase="$(jq -r '.current_phase // empty' receive-evidence.json)"
          case "$existing_phase" in
            FAILED_PRE_MUTATION)
              ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" \
                "retry-pre-mutation ${RELEASE_SHA}" >retry-evidence.json
              ;;
            ROLLED_BACK)
              ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" \
                "retry-rolled-back ${RELEASE_SHA}" >retry-evidence.json
              ;;
            FAILED_POST_MUTATION|ROLLBACK_STARTED|ROLLBACK_FAILED)
              echo "Existing release phase is not automatically retryable: $existing_phase" >&2
              exit 1
              ;;
            *)
              # Every validated non-terminal success phase is resumable.
              ;;
          esac
          set +e
          printf '%s' "$PHOENIX_RPC_PROVIDER_SLOT_1_API_KEY" |
            ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" "resume ${RELEASE_SHA}" \
            >release-evidence.json
          resume_code=$?
          set -e
          if (( resume_code != 0 )); then
            if ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" \
              "evidence ${RELEASE_SHA}" >failed-release-evidence.json
            then
              mv failed-release-evidence.json release-evidence.json
            fi
            exit "$resume_code"
          fi
          jq -e --arg sha "$RELEASE_SHA" \
            '.release_sha == $sha and .current_phase == "COMPLETED"' \
            release-evidence.json >/dev/null

      - name: Publish successful deployment status
        if: ${{ success() && steps.deployment.outputs.id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=success \
            -f environment=production-live \
            -f description="Phoenix release completed and verified" >/dev/null

      - name: Publish failed deployment status
        if: ${{ failure() && steps.deployment.outputs.id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=failure \
            -f environment=production-live \
            -f description="Phoenix release failed closed; inspect bounded evidence" >/dev/null

      - name: Upload bounded release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phoenix-release-evidence-${{ needs.prepare.outputs.release_sha }}
          path: |
            active.json
            deployment-impact.json
            package-digest.txt
            receive-evidence.json
            release-evidence.json
          if-no-files-found: warn
          retention-days: 90

      - name: Write release summary
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          BUILD_RUN_ID: ${{ needs.prepare.outputs.build_run_id }}
          ROLLBACK_SHA: ${{ steps.active.outputs.rollback_sha }}
        run: |
          {
            echo "## Phoenix automated release"
            echo
            echo "- Release SHA: \`$RELEASE_SHA\`"
            echo "- Immutable build run: \`$BUILD_RUN_ID\`"
            echo "- Rollback SHA: \`$ROLLBACK_SHA\`"
            echo "- Gateway protocol: \`phoenix-release.v1\`"
            if [ -f release-evidence.json ]; then
              echo "- Final phase: \`$(jq -r '.current_phase // "unknown"' release-evidence.json)\`"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

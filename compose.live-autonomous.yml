services:
  rpc-gateway:
    environment:
      AUTONOMOUS_EXECUTION: "true"
      RPC_UPSTREAM_CALLS_PER_SECOND: "16"
      RPC_UPSTREAM_CALL_BURST: "64"
      RPC_STATE_REQUESTS_PER_MINUTE: "60"

  phoenix-engine:
    environment:
      PHOENIX_MODE: LIVE
      LIVE_EXECUTION: "true"
      AUTONOMOUS_EXECUTION: "true"
      EXECUTOR_ADDRESS: ${LIVE_EXECUTOR_EXECUTOR_ADDRESS:?LIVE_EXECUTOR_EXECUTOR_ADDRESS is required}
      LIVE_EXECUTOR_EXECUTOR_CODE_HASH: ${LIVE_EXECUTOR_EXECUTOR_CODE_HASH:?LIVE_EXECUTOR_EXECUTOR_CODE_HASH is required}
      LIVE_EXECUTOR_EXPECTED_OWNER: ${LIVE_EXECUTOR_EXPECTED_OWNER:?LIVE_EXECUTOR_EXPECTED_OWNER is required}
      LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER: ${LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER:?LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER is required}
      LIVE_EXECUTOR_MAX_INPUT_AMOUNT: ${LIVE_EXECUTOR_MAX_INPUT_AMOUNT:?LIVE_EXECUTOR_MAX_INPUT_AMOUNT is required}

  atlas-observer:
    environment:
      PHOENIX_EXACT_STATE_REQUEST_BUDGET_PER_MINUTE: "60"
      # The gateway's protected 60/min budget leaves twenty-four requests for
      # base/hot/tail discovery and thirty-six for observed Exact work.
      PHOENIX_EXACT_DISCOVERY_RESERVE_PER_MINUTE: "24"

  autonomous-control:
    profiles: ["live-autonomous"]
    image: ${LIVE_EXECUTOR_IMAGE:?LIVE_EXECUTOR_IMAGE is required}
    build:
      context: .
      dockerfile: deploy/rust.Dockerfile
      args:
        CRATE: live-executor
    entrypoint: ["/usr/local/bin/autonomous-live-control"]
    environment:
      CHAIN_ID: "42161"
      POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      PHOENIX_RELEASE_SHA: ${PHOENIX_RELEASE_SHA:?PHOENIX_RELEASE_SHA is required}
      PHOENIX_OPERATOR_MODE: ${PHOENIX_MODE:?PHOENIX_MODE is required}
      PHOENIX_OPERATOR_LIVE_EXECUTION: ${LIVE_EXECUTION:?LIVE_EXECUTION is required}
      PHOENIX_OPERATOR_AUTONOMOUS_EXECUTION: ${AUTONOMOUS_EXECUTION:?AUTONOMOUS_EXECUTION is required}
      PHOENIX_ENGINE_IMAGE: ${PHOENIX_ENGINE_IMAGE:?PHOENIX_ENGINE_IMAGE is required}
      PRODUCTION_RPC_URL: https://arbitrum.nownodes.io/
      ENGINE_ROUTER_ADDRESSES: ${ENGINE_ROUTER_ADDRESSES:?ENGINE_ROUTER_ADDRESSES is required}
      WALLET_ADDRESS: ${LIVE_EXECUTOR_WALLET_ADDRESS:?LIVE_EXECUTOR_WALLET_ADDRESS is required}
      EXECUTOR_ADDRESS: ${LIVE_EXECUTOR_EXECUTOR_ADDRESS:?LIVE_EXECUTOR_EXECUTOR_ADDRESS is required}
      LIVE_EXECUTOR_EXECUTOR_CODE_HASH: ${LIVE_EXECUTOR_EXECUTOR_CODE_HASH:?LIVE_EXECUTOR_EXECUTOR_CODE_HASH is required}
      LIVE_EXECUTOR_EXPECTED_OWNER: ${LIVE_EXECUTOR_EXPECTED_OWNER:?LIVE_EXECUTOR_EXPECTED_OWNER is required}
      LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER: ${LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER:?LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER is required}
      LIVE_EXECUTOR_RPC_ALLOWLIST: https://arbitrum.nownodes.io/
      LIVE_EXECUTOR_RPC_HEADER_NAME: api-key
      LIVE_EXECUTOR_RPC_HEADER_FILE: /run/secrets/phoenix-rpc-provider-slot-1-api-key
      LIVE_EXECUTOR_PNL_ASSET_ADDRESS: ${LIVE_EXECUTOR_PNL_ASSET_ADDRESS:?LIVE_EXECUTOR_PNL_ASSET_ADDRESS is required}
      LIVE_EXECUTOR_ONE_TRANSACTION_AT_A_TIME: "true"
      LIVE_EXECUTOR_MAX_GAS_LIMIT: ${LIVE_EXECUTOR_MAX_GAS_LIMIT:?LIVE_EXECUTOR_MAX_GAS_LIMIT is required}
      LIVE_EXECUTOR_MAX_MAX_FEE_PER_GAS_WEI: ${LIVE_EXECUTOR_MAX_MAX_FEE_PER_GAS_WEI:?LIVE_EXECUTOR_MAX_MAX_FEE_PER_GAS_WEI is required}
      LIVE_EXECUTOR_MAX_PRIORITY_FEE_PER_GAS_WEI: ${LIVE_EXECUTOR_MAX_PRIORITY_FEE_PER_GAS_WEI:?LIVE_EXECUTOR_MAX_PRIORITY_FEE_PER_GAS_WEI is required}
      LIVE_EXECUTOR_MAX_INPUT_AMOUNT: ${LIVE_EXECUTOR_MAX_INPUT_AMOUNT:?LIVE_EXECUTOR_MAX_INPUT_AMOUNT is required}
      LIVE_EXECUTOR_MIN_EXPECTED_PROFIT: ${LIVE_EXECUTOR_MIN_EXPECTED_PROFIT:?LIVE_EXECUTOR_MIN_EXPECTED_PROFIT is required}
      LIVE_EXECUTOR_MAX_DAILY_LOSS_WEI: ${LIVE_EXECUTOR_MAX_DAILY_LOSS_WEI:?LIVE_EXECUTOR_MAX_DAILY_LOSS_WEI is required}
      LIVE_EXECUTOR_MAX_ATLAS_BID_WEI: ${LIVE_EXECUTOR_MAX_ATLAS_BID_WEI:-1000000000000000}
      LIVE_EXECUTOR_RECEIPT_TIMEOUT_SECONDS: ${LIVE_EXECUTOR_RECEIPT_TIMEOUT_SECONDS:-180}
      LIVE_EXECUTOR_POLL_INTERVAL_SECONDS: ${LIVE_EXECUTOR_POLL_INTERVAL_SECONDS:-1}
      PHOENIX_ACTIVATION_REQUEST_OUTBOX: /activation-outbox
    depends_on:
      postgres:
        condition: service_healthy
    networks: [phoenix-internal]
    init: true
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    volumes:
      - type: bind
        source: /etc/phoenix/secrets/phoenix-rpc-provider-slot-1-api-key
        target: /run/secrets/phoenix-rpc-provider-slot-1-api-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/phoenix/evidence/activation-requests
        target: /activation-outbox
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  economic-monitor:
    profiles: ["live-autonomous"]
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    entrypoint: ["/bin/sh", "/opt/phoenix/economic-dashboard-loop.sh"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      PHOENIX_ECONOMIC_DASHBOARD_INTERVAL_SECONDS: "45"
      PHOENIX_ECONOMIC_DASHBOARD_QUERY_TIMEOUT_SECONDS: "30"
      PHOENIX_ECONOMIC_DASHBOARD_SQL: /opt/phoenix/economic-dashboard-snapshot.sql
      PHOENIX_ECONOMIC_DASHBOARD_OUTPUT: /evidence/latest-dashboard.json
    volumes:
      - /opt/phoenix/deploy/economic-dashboard-loop.sh:/opt/phoenix/economic-dashboard-loop.sh:ro
      - /opt/phoenix/deploy/sql/economic-dashboard-snapshot.sql:/opt/phoenix/economic-dashboard-snapshot.sql:ro
      - /opt/phoenix/evidence/dashboard:/evidence
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    networks: [phoenix-internal]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "find /evidence/latest-dashboard.json -maxdepth 0 -type f -size +0c -mmin -3 -print -quit 2>/dev/null | grep -q ."]
      interval: 45s
      timeout: 3s
      retries: 3

  economic-supervisor:
    profiles: ["live-autonomous"]
    image: ${LIVE_EXECUTOR_IMAGE:?LIVE_EXECUTOR_IMAGE is required}
    entrypoint: ["/usr/local/bin/autonomous-live-control"]
    command: ["supervise-economic-control"]
    environment:
      CHAIN_ID: "42161"
      POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      PHOENIX_RELEASE_SHA: ${PHOENIX_RELEASE_SHA:?PHOENIX_RELEASE_SHA is required}
      PHOENIX_ENGINE_IMAGE: ${PHOENIX_ENGINE_IMAGE:?PHOENIX_ENGINE_IMAGE is required}
      PRODUCTION_RPC_URL: https://arbitrum.nownodes.io/
      ENGINE_ROUTER_ADDRESSES: ${ENGINE_ROUTER_ADDRESSES:?ENGINE_ROUTER_ADDRESSES is required}
      LIVE_EXECUTOR_RPC_ALLOWLIST: https://arbitrum.nownodes.io/
      LIVE_EXECUTOR_RPC_HEADER_NAME: api-key
      LIVE_EXECUTOR_RPC_HEADER_FILE: /run/secrets/phoenix-rpc-provider-slot-1-api-key
      WALLET_ADDRESS: ${LIVE_EXECUTOR_WALLET_ADDRESS:?LIVE_EXECUTOR_WALLET_ADDRESS is required}
      EXECUTOR_ADDRESS: ${LIVE_EXECUTOR_EXECUTOR_ADDRESS:?LIVE_EXECUTOR_EXECUTOR_ADDRESS is required}
      LIVE_EXECUTOR_EXECUTOR_CODE_HASH: ${LIVE_EXECUTOR_EXECUTOR_CODE_HASH:?LIVE_EXECUTOR_EXECUTOR_CODE_HASH is required}
      LIVE_EXECUTOR_EXPECTED_OWNER: ${LIVE_EXECUTOR_EXPECTED_OWNER:?LIVE_EXECUTOR_EXPECTED_OWNER is required}
      LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER: ${LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER:?LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER is required}
      LIVE_EXECUTOR_PNL_ASSET_ADDRESS: ${LIVE_EXECUTOR_PNL_ASSET_ADDRESS:?LIVE_EXECUTOR_PNL_ASSET_ADDRESS is required}
      LIVE_EXECUTOR_ONE_TRANSACTION_AT_A_TIME: "true"
      LIVE_EXECUTOR_MAX_GAS_LIMIT: ${LIVE_EXECUTOR_MAX_GAS_LIMIT:?LIVE_EXECUTOR_MAX_GAS_LIMIT is required}
      LIVE_EXECUTOR_MAX_MAX_FEE_PER_GAS_WEI: ${LIVE_EXECUTOR_MAX_MAX_FEE_PER_GAS_WEI:?LIVE_EXECUTOR_MAX_MAX_FEE_PER_GAS_WEI is required}
      LIVE_EXECUTOR_MAX_PRIORITY_FEE_PER_GAS_WEI: ${LIVE_EXECUTOR_MAX_PRIORITY_FEE_PER_GAS_WEI:?LIVE_EXECUTOR_MAX_PRIORITY_FEE_PER_GAS_WEI is required}
      LIVE_EXECUTOR_MAX_INPUT_AMOUNT: ${LIVE_EXECUTOR_MAX_INPUT_AMOUNT:?LIVE_EXECUTOR_MAX_INPUT_AMOUNT is required}
      LIVE_EXECUTOR_MAX_DAILY_LOSS_WEI: ${LIVE_EXECUTOR_MAX_DAILY_LOSS_WEI:?LIVE_EXECUTOR_MAX_DAILY_LOSS_WEI is required}
      LIVE_EXECUTOR_RECEIPT_TIMEOUT_SECONDS: ${LIVE_EXECUTOR_RECEIPT_TIMEOUT_SECONDS:-180}
      LIVE_EXECUTOR_POLL_INTERVAL_SECONDS: ${LIVE_EXECUTOR_POLL_INTERVAL_SECONDS:-1}
      PHOENIX_ACTIVATION_REQUEST_OUTBOX: /activation-outbox
      PHOENIX_ACTIVATION_REQUEST_INTERVAL_MILLISECONDS: "500"
      PHOENIX_ECONOMIC_SUPERVISOR_INTERVAL_SECONDS: "45"
      PHOENIX_CURRENT_RELEASE_PATH: /release-identity/current-release
      PHOENIX_RELEASE_ASSETS_PATH: /release-identity/release-assets.sha
    volumes:
      - type: bind
        source: /etc/phoenix/secrets/phoenix-rpc-provider-slot-1-api-key
        target: /run/secrets/phoenix-rpc-provider-slot-1-api-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/phoenix/evidence/activation-requests
        target: /activation-outbox
        bind:
          create_host_path: false
      - type: bind
        source: /opt/phoenix/deploy/current-release
        target: /release-identity/current-release
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/phoenix/deploy/release-assets.sha
        target: /release-identity/release-assets.sha
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      rpc-gateway:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    networks: [phoenix-internal]
    init: true
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  live-executor:
    profiles: ["live-autonomous"]
    image: ${LIVE_EXECUTOR_IMAGE:?LIVE_EXECUTOR_IMAGE is required}
    build:
      context: .
      dockerfile: deploy/rust.Dockerfile
      args:
        CRATE: live-executor
    environment:
      PHOENIX_MODE: LIVE
      LIVE_EXECUTION: "true"
      AUTONOMOUS_EXECUTION: "true"
      # Environment authority keeps the process continuously live; exact
      # per-lane database controls, the global lock, and the on-chain pause are
      # independent mandatory gates for every submission.
      LIVE_EXECUTOR_HUNTING_STANDBY: "false"
      LIVE_EXECUTOR_ARMED: "true"
      LIVE_EXECUTOR_KILL_SWITCH: "false"
      LIVE_EXECUTOR_ONE_TRANSACTION_AT_A_TIME: "true"
      CHAIN_ID: "42161"
      POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      PHOENIX_RELEASE_SHA: ${PHOENIX_RELEASE_SHA:?PHOENIX_RELEASE_SHA is required}
      PHOENIX_OPERATOR_MODE: ${PHOENIX_MODE:?PHOENIX_MODE is required}
      PHOENIX_OPERATOR_LIVE_EXECUTION: ${LIVE_EXECUTION:?LIVE_EXECUTION is required}
      PHOENIX_OPERATOR_AUTONOMOUS_EXECUTION: ${AUTONOMOUS_EXECUTION:?AUTONOMOUS_EXECUTION is required}
      PRODUCTION_RPC_URL: https://arbitrum.nownodes.io/
      ENGINE_ROUTER_ADDRESSES: ${ENGINE_ROUTER_ADDRESSES:?ENGINE_ROUTER_ADDRESSES is required}
      SIGNER_PRIVATE_KEY_FILE: /run/secrets/phoenix-live-executor-signer
      WALLET_ADDRESS: ${LIVE_EXECUTOR_WALLET_ADDRESS:?LIVE_EXECUTOR_WALLET_ADDRESS is required}
      EXECUTOR_ADDRESS: ${LIVE_EXECUTOR_EXECUTOR_ADDRESS:?LIVE_EXECUTOR_EXECUTOR_ADDRESS is required}
      LIVE_EXECUTOR_EXECUTOR_CODE_HASH: ${LIVE_EXECUTOR_EXECUTOR_CODE_HASH:?LIVE_EXECUTOR_EXECUTOR_CODE_HASH is required}
      LIVE_EXECUTOR_EXPECTED_OWNER: ${LIVE_EXECUTOR_EXPECTED_OWNER:?LIVE_EXECUTOR_EXPECTED_OWNER is required}
      LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER: ${LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER:?LIVE_EXECUTOR_EXPECTED_FLASH_PROVIDER is required}
      LIVE_EXECUTOR_PNL_ASSET_ADDRESS: ${LIVE_EXECUTOR_PNL_ASSET_ADDRESS:?LIVE_EXECUTOR_PNL_ASSET_ADDRESS is required}
      LIVE_EXECUTOR_RPC_URL: https://arbitrum.nownodes.io/
      LIVE_EXECUTOR_RPC_ALLOWLIST: https://arbitrum.nownodes.io/
      LIVE_EXECUTOR_RPC_HEADER_NAME: api-key
      LIVE_EXECUTOR_RPC_HEADER_FILE: /run/secrets/phoenix-rpc-provider-slot-1-api-key
      LIVE_EXECUTOR_MAX_GAS_LIMIT: ${LIVE_EXECUTOR_MAX_GAS_LIMIT:?LIVE_EXECUTOR_MAX_GAS_LIMIT is required}
      LIVE_EXECUTOR_MAX_MAX_FEE_PER_GAS_WEI: ${LIVE_EXECUTOR_MAX_MAX_FEE_PER_GAS_WEI:?LIVE_EXECUTOR_MAX_MAX_FEE_PER_GAS_WEI is required}
      LIVE_EXECUTOR_MAX_PRIORITY_FEE_PER_GAS_WEI: ${LIVE_EXECUTOR_MAX_PRIORITY_FEE_PER_GAS_WEI:?LIVE_EXECUTOR_MAX_PRIORITY_FEE_PER_GAS_WEI is required}
      LIVE_EXECUTOR_MAX_INPUT_AMOUNT: ${LIVE_EXECUTOR_MAX_INPUT_AMOUNT:?LIVE_EXECUTOR_MAX_INPUT_AMOUNT is required}
      LIVE_EXECUTOR_MIN_EXPECTED_PROFIT: ${LIVE_EXECUTOR_MIN_EXPECTED_PROFIT:?LIVE_EXECUTOR_MIN_EXPECTED_PROFIT is required}
      LIVE_EXECUTOR_MAX_DAILY_LOSS_WEI: ${LIVE_EXECUTOR_MAX_DAILY_LOSS_WEI:?LIVE_EXECUTOR_MAX_DAILY_LOSS_WEI is required}
      LIVE_EXECUTOR_RECEIPT_TIMEOUT_SECONDS: ${LIVE_EXECUTOR_RECEIPT_TIMEOUT_SECONDS:-180}
      LIVE_EXECUTOR_POLL_INTERVAL_SECONDS: ${LIVE_EXECUTOR_POLL_INTERVAL_SECONDS:-1}
    volumes:
      - type: bind
        source: /etc/phoenix/secrets/phoenix-rpc-provider-slot-1-api-key
        target: /run/secrets/phoenix-rpc-provider-slot-1-api-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIVE_EXECUTOR_SIGNER_FILE:?LIVE_EXECUTOR_SIGNER_FILE is required}
        target: /run/secrets/phoenix-live-executor-signer
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rpc-gateway:
        condition: service_healthy
      phoenix-engine:
        condition: service_healthy
    networks: [phoenix-internal]
    init: true
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 5
